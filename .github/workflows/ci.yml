name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          set -euo pipefail
          for f in index.html README.md LICENSE package.json serve.py; do
            test -f "$f" || (echo "Missing $f" && exit 1)
          done
          test -d js
          test -d assets
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Install (optional deps)
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Static sanity (no build)
        run: |
          echo "No JS build step; repository is static ESM."
